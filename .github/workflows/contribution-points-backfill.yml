name: Contribution Points Backfill

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Dry-run only, or persist eligible historical awards"
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - apply

permissions:
  contents: write
  issues: read
  pull-requests: read

concurrency:
  group: contribution-points-${{ github.repository }}
  cancel-in-progress: false

jobs:
  backfill:
    name: Historical Contribution Points
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout trusted repository state
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Calculate historical Contribution Points
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODE: ${{ inputs.mode }}
        run: |
          if [ "$MODE" = "apply" ]; then
            python .github/scripts/contribution_points_sprints.py backfill --apply
          else
            python .github/scripts/contribution_points_sprints.py backfill --dry-run
          fi

      - name: Publish job summary
        if: always()
        run: |
          if [ -f contribution-points-backfill.md ]; then
            cat contribution-points-backfill.md >> "$GITHUB_STEP_SUMMARY"
          elif [ -f contribution-points-dry-run.md ]; then
            cat contribution-points-dry-run.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload backfill report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contribution-points-backend-${{ inputs.mode }}
          path: |
            contribution-points-backfill.json
            contribution-points-backfill.md
            contribution-points-dry-run.json
            contribution-points-dry-run.md
          if-no-files-found: warn
          retention-days: 30
