name: Contribution Points Backfill Activate

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/contribution-points-backfill.yml

permissions:
  contents: write
  issues: read
  pull-requests: read

concurrency:
  group: contribution-points-backfill-${{ github.repository }}
  cancel-in-progress: false

jobs:
  apply:
    name: Persist historical Contribution Points
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout trusted repository state
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Apply historical contribution points
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/scripts/contribution_points.py backfill --apply

      - name: Publish job summary
        if: always()
        run: |
          if [ -f contribution-points-backfill.md ]; then
            cat contribution-points-backfill.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload backfill report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contribution-points-backend-backfill
          path: |
            contribution-points-backfill.json
            contribution-points-backfill.md
          if-no-files-found: warn
          retention-days: 30
