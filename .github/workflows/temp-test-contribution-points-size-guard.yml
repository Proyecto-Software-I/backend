name: Temporary - Test Contribution Points Size Guard

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/temp-test-contribution-points-size-guard.yml

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout trusted repository state
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Verify trust policy against synthetic tampering
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, '.github/scripts')
          import contribution_points_guarded as guard

          assert guard._event_is_trusted({'actor': {'login': 'S3B4S5C'}, 'createdAt': '2026-09-10T12:00:00Z'})
          assert not guard._event_is_trusted({'actor': {'login': 'Orlando693'}, 'createdAt': '2026-09-02T21:20:00Z'})
          assert not guard._event_is_trusted({'actor': {'login': 'DarksouleaterXD'}, 'createdAt': '2026-09-10T12:00:00Z'})
          assert guard._event_is_trusted({'actor': {'login': 'github-actions'}, 'createdAt': '2026-09-02T21:18:51Z'})
          assert guard._event_is_trusted({'actor': {'login': 'github-actions[bot]'}, 'createdAt': '2026-09-02T21:18:51Z'})
          assert not guard._event_is_trusted({'actor': {'login': 'github-actions'}, 'createdAt': '2026-09-03T00:00:00Z'})
          assert not guard._event_is_trusted({'actor': {'login': 'github-actions[bot]'}, 'createdAt': '2026-09-10T12:00:00Z'})
          print('synthetic trust/tampering policy: OK')
          PY

      - name: Audit representative frozen sizes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python .github/scripts/contribution_points_guarded.py audit-size --repository Proyecto-Software-I/backend --issue-number 15
          python .github/scripts/contribution_points_guarded.py audit-size --repository Proyecto-Software-I/frontend --issue-number 22

      - name: Verify backend sprint-aware historical dry run
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python .github/scripts/contribution_points_sprints_guarded.py backfill --dry-run --repository Proyecto-Software-I/backend
          python - <<'PY'
          import json
          data = json.load(open('contribution-points-dry-run.json', encoding='utf-8'))
          assert data['schemaVersion'] == 2, data
          assert data['awards'] == 3, data
          assert data['totalPoints'] == 21, data
          leaders = {row['login']: row['points'] for row in data['leaderboard']}
          assert leaders == {'Orlando693': 13, 'DarksouleaterXD': 8}, leaders
          print('backend sprint-aware dry-run unchanged:', data['awards'], data['totalPoints'], leaders)
          PY
          mv contribution-points-dry-run.json backend-dry-run.json
          mv contribution-points-dry-run.md backend-dry-run.md

      - name: Verify frontend sprint-aware historical dry run
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python .github/scripts/contribution_points_sprints_guarded.py backfill --dry-run --repository Proyecto-Software-I/frontend
          python - <<'PY'
          import json
          data = json.load(open('contribution-points-dry-run.json', encoding='utf-8'))
          assert data['schemaVersion'] == 2, data
          assert data['awards'] == 4, data
          assert data['totalPoints'] == 19, data
          leaders = {row['login']: row['points'] for row in data['leaderboard']}
          assert leaders == {'brahiamsinho': 11, 'DarksouleaterXD': 5, 'Orlando693': 3}, leaders
          print('frontend sprint-aware dry-run unchanged:', data['awards'], data['totalPoints'], leaders)
          PY

      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contribution-points-size-guard-verification
          path: |
            backend-dry-run.json
            backend-dry-run.md
            contribution-points-dry-run.json
            contribution-points-dry-run.md
          if-no-files-found: warn
          retention-days: 7
