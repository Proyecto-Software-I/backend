name: Temporary - Cleanup Sprint Setup Branches

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/temp-cleanup-sprint-setup-branches.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete accidental temporary branches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          for branch in \
            tmp-sprint-aware-points \
            tmp-sprint-aware-points-2 \
            tmp-sprint-aware-points-3 \
            tmp-sprint-aware-points-4 \
            tmp-sprint-aware-points-5
          do
            status=$(curl --silent --output /tmp/body --write-out '%{http_code}' \
              --request DELETE \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "X-GitHub-Api-Version: 2026-03-10" \
              "https://api.github.com/repos/${REPO}/git/refs/heads/${branch}")
            if [ "$status" != "204" ] && [ "$status" != "422" ]; then
              cat /tmp/body
              exit 1
            fi
          done
